# Publishes ./site to GitHub Pages.
#
# Pages' built-in "deploy from a branch" option only accepts / or /docs as a
# source, and moving the site to the repo root would collide with the raw
# data/ download directory. Deploying the subdirectory through Actions keeps
# site/ named for what it is.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check lookup geometry
        run: node site/test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check hauler classifier
        run: python build_haulers.py --check
      # The JS computes tile keys independently; if the two ever disagree the
      # browser requests files that were never written and every well count
      # silently reads zero.
      - name: Check well tiling
        run: python build_wells55.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
